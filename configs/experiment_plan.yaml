  clear_reasoning: true
  clear_retrieval_cache: true
  clear_temporary_state: true
  remove_all_acquisition_overlays: true
  clean_pool_hash_required_before_any_arm_specific_deployment_setup: true
  clean_reset_attested_for_all_arms_before_D_overlay_setup: true
  only_installed_artifact_crosses_boundary_for: [A_matched_sham, B_full_attack, C_discard_skill, Eraw_identity_compiler_packet_artifact]
  D_execution_rag_exception:
    attach_after_clean_reset_attestation: true
    source: independent_frozen_hash_locked_deployment_overlay_manifest
    reuse_acquisition_index_cache_or_process: false
    run_scoped_D_only_index: true
    final_snapshot_hash_required: true
  attestation_required: true
