reproducibility:
  task_scenario_allocation_seed: 20260829
  P4_slot_selection_seed: 2026082943
  P4_distractor_selection_seed: 2026082944
  calibration_seeds: [2026082901, 2026082902, 2026082903]
  train_clean_characterization_seed: 2026082911
  confirmatory_primary_seed_base: 2026082921
  confirmatory_audit_seed_base: 2026082922
  external_validity_seeds: [2026082931, 2026082932, 2026082933]
  deterministic_derivation_contract:
    primitive: HMAC_SHA256
    key_encoding: unsigned_uint64_big_endian_of_decimal_base_seed
    message_encoding: compact_UTF8_JSON_with_fixed_key_order
    per_run_message_key_order: [protocol, block_id, stage, task_id, replicate]
    per_run_protocol_value: r2sp-v0.1
    per_run_arm_field_present: false
    stage_enum_frozen_in_conformance_manifest: true
    vllm_seed_mapping: uint32_big_endian_of_digest_bytes_0_to_3_bitwise_AND_0x7fffffff
    conformance_test_vectors_required: true
  attack_sham_assignment:
    key_source: sealed_uniform_random_256_bit_key
    key_encoding: raw_32_bytes
    key_commitment: SHA256_of_raw_key_required_before_first_labeled_attack_run
    key_reveal: only_after_confirmatory_analysis_lock
    message_key_order: [protocol, purpose, block_id]
    purpose_value: attack_sham_slot_assignment
    fair_coin_bit: least_significant_bit_of_digest_byte_0
    bit_zero_mapping: attack_to_slot_X_sham_to_slot_Y
    bit_one_mapping: attack_to_slot_Y_sham_to_slot_X
    independent_product_law_across_blocks: true
    balancing_rerandomization_or_rejection: false
  P4_slot_selection:
    domain_separated_from_treatment_assignment: true
    purpose_value: P4_matched_block_slot_selection
    selection_hash_uses_P4_slot_selection_seed: true
    message_key_order: [protocol, purpose, template_id, domain_id, block_id]
    select: lexicographically_lowest_full_256_bit_digest_among_eligible_blocks
    exact_digest_tie_break: block_id_ascending
  P4_distractor_selection:
    domain_separated_from_treatment_and_target_selection: true
    purpose_value: P4_arm_common_sham_distractor_selection
    selection_hash_uses_P4_distractor_selection_seed: true
    message_key_order: [protocol, purpose, block_id]
    eligible_set: confirmatory_matched_blocks_not_selected_as_any_P4_target
    select: nineteen_lexicographically_lowest_full_256_bit_digests
    exact_digest_tie_break: block_id_ascending
  immutable_run_bundles: true
  operator_and_analyst_blinded: true
  attack_author_blinded: false

software:
  environments:
    model_service:
      python: "3.11"
      lockfile: locks/model-service.lock
      constraints:
        pydantic: ">=2.12"
        fastapi: ">=0.133,<0.137"
    appworld_runtime:
      python: "3.11"
      lockfile: locks/appworld-runtime.lock
      constraints:
        pydantic: "<2"
        fastapi: ">=0.110,<0.111"
        click: "<8.3.0"
    share_site_packages: false
    communication: versioned_localhost_json_rpc_schema
  appworld:
    pypi_version: "0.1.3.post1"
    git_tag: v0.1.3.post1
    git_revision: "66ad8099e12188ece0d3fe45e661dbc01880813b"
    data_bundle: data-0.1.0.bundle
    data_bundle_sha256: null
    compatibility_constraints:
      pydantic: "<2"
      fastapi: ">=0.110,<0.111"
      click: "<8.3.0"
  model:
    id: Qwen/Qwen3.8-27B
    hf_revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    tokenizer_revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    dtype: bfloat16
    kv_cache_dtype: auto
  serving:
    engine: vllm
    version: "0.28.0"
    transformers_version: "5.16.1"
    tensor_parallel_size: 1
    max_model_len: 65536
    gpu_memory_utilization: 0.90
    max_num_seqs: 1
    cross_unit_or_arm_model_request_concurrency_in_P2_P3_P4: false
    prefix_caching: false
    explicit_cli_flag: --no-enable-prefix-caching
    server_side_sessions: false
    speculative_decoding: false
    reasoning_parser: qwen3
    tool_call_parser: qwen3_coder
    model_revision_required_on_command_line: true

hardware:
