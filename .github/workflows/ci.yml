name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check experiments/tau-knowledge/skill-evolution/src experiments/tau-knowledge/skill-evolution/tests experiments/tau-knowledge/skill-evolution/scripts
      - run: ruff format --check experiments/tau-knowledge/skill-evolution/src experiments/tau-knowledge/skill-evolution/tests experiments/tau-knowledge/skill-evolution/scripts
      - run: python -m compileall -q experiments/tau-knowledge/skill-evolution/src experiments/tau-knowledge/skill-evolution/tests experiments/tau-knowledge/skill-evolution/scripts
      - run: python -c 'from tau_skill_evolution.spec import load_spec; load_spec()'
