name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests experiments/appworld/preliminary/tests experiments/tau-knowledge/preliminary/tests
      - run: ruff check src tests experiments/appworld/preliminary/tests experiments/tau-knowledge/preliminary/tests
      - run: ruff format --check src tests experiments/appworld/preliminary/tests experiments/tau-knowledge/preliminary/tests
      - run: python -m compileall -q src tests experiments/appworld/preliminary/tests experiments/tau-knowledge/preliminary/tests
      - run: r2sp validate-config --config experiments/appworld/preliminary/configs/experiment_plan.yaml
