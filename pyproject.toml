[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau-skill-evolution"
version = "0.1.0"
description = "τ-Knowledge one-shot Skill creation and co-evolutionary verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
r2sp = "tau_skill_evolution.cli:main"

[tool.setuptools]
package-dir = {"" = "experiments/tau-knowledge/skill-evolution/src"}

[tool.setuptools.packages.find]
where = ["experiments/tau-knowledge/skill-evolution/src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["experiments/tau-knowledge/skill-evolution/tests"]
addopts = "-ra"
